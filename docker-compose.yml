services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rangyar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - rangyar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rangyar"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:change-this-password@db:5432/rangyar
      AUTH_SECRET: change-this-auth-secret
      REQUIRE_AUTH: "true"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  rangyar-db:
